<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20232b"><title>Strata — World studio</title><link rel="stylesheet" href="style.css"></head>
<body><main id="viewport">
<canvas id="scene" aria-label="3D world. Move the mouse or drag on touch to look around. Click the scene to pause or resume mouse-look. Use the arrow keys to move."></canvas>
<h1><span aria-hidden="true">▱</span> Strata</h1>
<div id="notice" role="status"></div>
<div class="walk-pad" role="group" aria-label="Walk">
<button data-walk="ArrowUp" aria-label="Walk forward">↑</button>
<button data-walk="ArrowLeft" aria-label="Walk left">←</button>
<button data-walk="ArrowDown" aria-label="Walk backward">↓</button>
<button data-walk="ArrowRight" aria-label="Walk right">→</button>
</div>
<div class="studio">
<section id="panel" hidden aria-labelledby="heading">
<header><h2 id="heading">Materials</h2><button id="close" aria-label="Close panel">×</button></header>
<div class="targets" role="group" aria-label="Apply material to"><button data-t="floor">Floor</button><button data-t="ceiling">Ceiling</button></div>
<div id="library"><div class="swatches" aria-label="Material choices"></div><button id="upload">↑ &nbsp; Upload image</button></div>
<div id="chat" hidden><div id="log" aria-live="polite"></div><form><textarea maxlength="1600" required placeholder="Describe a material…" aria-label="Material description"></textarea><button id="send">Generate material</button></form></div>
</section>
<nav aria-label="World controls">
<button data-panel="library" aria-label="Materials" title="Materials" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg></button>
<button data-panel="chat" aria-label="Material assistant" title="Material assistant" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 4h16v13h-9l-5 4v-4H4zM8 9h8M8 12h5"/></svg></button>
<i></i><button id="reset" aria-label="Reset view" title="Reset view"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
<button id="expand" aria-label="Toggle fullscreen" title="Toggle fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5m-6 0H4v-5"/></svg></button>
</nav></div><input type="file" id="file" accept="image/*" hidden>
</main><script src="palette.js"></script><script src="app.js"></script></body></html>
